name: Bedrock (настоящий сервер)

on:
  push:
    branches: ['**']
    paths: ['src/bedrock/**', 'src/agent/**', 'test/bedrock-*.mjs', '.github/workflows/bedrock-real.yml', 'package.json']
  workflow_dispatch:

concurrency:
  group: bedrock-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.26.60', '1.21.50', '1.20.80', '1.19.1', '1.16.220']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm i --no-save minecraft-bedrock-server@1.8.0
      - name: libssl1.1 для старых серверов Bedrock (1.16–1.19 собраны под старый OpenSSL)
        if: startsWith(matrix.version, '1.16') || startsWith(matrix.version, '1.19')
        run: |
          wget -q http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb -O /tmp/libssl1.1.deb \
            || wget -q http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb -O /tmp/libssl1.1.deb
          sudo dpkg -i /tmp/libssl1.1.deb
      - name: Бот против Bedrock Dedicated Server ${{ matrix.version }}
        run: node --no-warnings test/bedrock-bds.mjs ${{ matrix.version }} 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        env:
          # подробный сетевой лог — чтобы видеть, на каком шаге рвётся подключение
          DEBUG: ${{ matrix.version != '1.26.60' && 'raknet' || '' }}
      - name: Зонд пакетов рук (новейшая версия)
        if: failure() && matrix.version == '1.26.60' && false
        continue-on-error: true
        run: node --no-warnings test/bedrock-probe.mjs ${{ matrix.version }} 2>&1 | grep -v raknet | tail -60
      - name: Сетевой лог (при ошибке)
        if: failure()
        run: grep -vE '^\s*$' test.log | grep -iE 'mypal|raknet|connect|incompat|pong|request|reply|mtu|protocol|error' | head -120
